name: Native Windows and macOS packages
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.4'
      - run: python -m pip install -r requirements.txt pyinstaller==6.22.3
      - run: bash packaging/build_macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.runner }}
          path: dist/RoastSeeNEXT-Artisan-macOS-*.zip
          if-no-files-found: error
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.4'
      - run: python -m pip install -r requirements.txt pyinstaller==6.22.3
      - run: ./packaging/build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/RoastSeeNEXT-Artisan-Windows-x64.zip
          if-no-files-found: error
  publish:
    needs: [macos, windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - name: Checksums and release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd packages
          sha256sum *.zip > SHA256SUMS.txt
          gh release create "$RELEASE_TAG" *.zip SHA256SUMS.txt --verify-tag --title "$RELEASE_TAG - Windows and macOS bridge" --notes "Native Windows x64, macOS Apple Silicon (arm64) and Intel (x86_64) packages. macOS builds were smoke-tested on macOS 15; no real BLE or Artisan roast was tested. Mac apps are ad-hoc signed, not Apple-notarized. Extract the full folder and follow the four-step guide in either README. Target NEXT firmware: 1.2.0; yellow/DRY limitations still apply."
