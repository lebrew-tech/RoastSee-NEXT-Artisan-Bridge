name: Native Windows and macOS packages
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.4'
      - run: python -m pip install -r requirements.txt pyinstaller==6.22.3
      - run: bash packaging/macos/build_macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-universal2
          path: dist/macos/RoastSeeNEXT-Artisan-macOS-*.zip
          if-no-files-found: error
  macos-test:
    needs: macos
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.4'
      - uses: actions/download-artifact@v4
        with:
          name: macos-universal2
          path: build/macos-check
      - name: Test the same universal ZIP on each architecture
        run: |
          mkdir -p build/macos-check/unpacked
          ditto -x -k build/macos-check/RoastSeeNEXT-Artisan-macOS-universal2.zip build/macos-check/unpacked
          BUNDLE=build/macos-check/unpacked/RoastSeeNEXT-Artisan-macOS-universal2
          codesign --verify --deep --strict "$BUNDLE/RoastSeeNEXTBridge.app"
          PYTHONPATH=. python packaging/macos/verify_macos.py "$BUNDLE"
          python packaging/macos/verify_universal2.py "$BUNDLE/RoastSeeNEXTBridge.app"
          uname -m
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.4'
      - run: python -m pip install -r requirements.txt pyinstaller==6.22.3
      - run: ./packaging/windows/build_windows.ps1
      - name: Build the Windows installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging/windows/installer.iss
      - name: Check the installed Windows programs
        shell: pwsh
        run: |
          $installer = Resolve-Path dist/windows/RoastSeeNEXT-Artisan-Windows-x64-Setup.exe
          $setup = Start-Process -FilePath $installer -ArgumentList '/VERYSILENT /NORESTART /SUPPRESSMSGBOXES' -WindowStyle Hidden -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Setup exited with $($setup.ExitCode)" }
          python packaging/windows/verify_bundle.py "$env:LOCALAPPDATA/Programs/RoastSeeNEXT-Artisan"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            dist/windows/RoastSeeNEXT-Artisan-Windows-x64.zip
            dist/windows/RoastSeeNEXT-Artisan-Windows-x64-Setup.exe
          if-no-files-found: error
  publish:
    needs: [macos-test, windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - name: Checksums and release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd packages
          sha256sum *.zip *.exe > SHA256SUMS.txt
          gh release create "$RELEASE_TAG" *.zip *.exe SHA256SUMS.txt --verify-tag --title "$RELEASE_TAG - Universal Mac bridge" --notes "One macOS universal2 ZIP for both Apple Silicon and Intel. The same ZIP was extracted and smoke-tested natively on both macOS 15 architectures, and all Mach-O files were checked for arm64 and x86_64 slices. Windows users can run the Setup.exe installer or extract the portable ZIP. No real BLE or Artisan roast was tested. Mac apps are ad-hoc signed, not Apple-notarized. Mac command-line users can extract the folder and open START_HERE.command. See the README for checked NEXT firmware versions and yellow/DRY limits."
